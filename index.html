<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <title>N Clock</title>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1 class="title">N Clock</h1>
    </div>

    <div class="tabs">
      <div class="tab" id="tabClock">時計</div>
      <div class="tab" id="tabStopwatch">ストップウォッチ</div>
      <div class="tab" id="tabAlarm">アラーム</div>
      <div class="tab" id="tabSettings">設定</div>
    </div>

    <div class="main">
      <div class="time-display" id="display">00:00</div>

      <div class="slider-box" id="sliderBox">
        <div class="label-row">
          <span id="labelLeft">1日の長さ</span>
          <span id="labelHours">24 時間</span>
        </div>
        <input type="range" min="12" max="48" value="24" id="sliderHours">
      </div>

      <div id="stopwatchArea" style="display:none;">
        <div class="controls">
          <button class="btn-circle btn-start" id="swStart" data-key-start>Start</button>
          <button class="btn-circle mono" id="swLap" data-key="btn.lap" disabled>Lap</button>
          <button class="btn-circle mono" id="swReset" data-key="btn.reset" disabled>Reset</button>
        </div>
        <div class="lap-list" id="lapList"></div>
      </div>

      <div id="alarmArea" style="display:none;">
        <div class="alarm-controls">
          <input type="time" class="time-input" id="alarmTime">
          <button class="btn-large" id="alarmSetBtn" data-key="btn.addAlarm">アラーム追加</button>
        </div>
        <div class="alarms-container" id="alarmsContainer"></div>
      </div>

      <div id="settingsArea" style="display:none;">
        <div class="settings-row">
          <span class="setting-label" data-key="settings.showSeconds">秒数表示</span>
          <label class="switch">
            <input type="checkbox" id="secondsToggle">
            <span class="slider-switch"></span>
          </label>
        </div>
        <div class="settings-row">
          <span class="setting-label" data-key="settings.language">言語</span>
          <select class="lang-select" id="langSelectSettings">
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
        </div>
      </div>

      <select class="lang-select" id="langSelect" style="display:none;">
        <option value="ja">日本語</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="footer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
